name: Application Android

on:
  push:
    branches: [main, feat/scan-pdf-et-corrections]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Le SDK Android est préinstallé sur ubuntu-latest (ANDROID_HOME) ; Gradle télécharge la plateforme manquante.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clé de signature (secret ANDROID_KEYSTORE_BASE64, sinon clé de test)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/coordination.jks"
            echo "COORD_KEYSTORE=$RUNNER_TEMP/coordination.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucun secret ANDROID_KEYSTORE_BASE64 : APK signé avec une clé de test (mises à jour impossibles sans désinstaller)."
          fi

      - name: Compiler l'APK
        working-directory: android
        env:
          COORD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COORD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COORD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          COORD_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk "Coordination-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Coordination-apk
          path: Coordination-*.apk

      - name: Publier (release « android-latest », téléchargeable depuis le téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest "Coordination-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease \
            --title "Application Android Coordination (build ${{ github.run_number }})" \
            --notes "APK de l'application Coordination (ouvre uniquement Coordination sur cloud.csmtaksit.dz). Installer : ouvrir ce fichier sur le téléphone et autoriser les sources inconnues."
